<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hautū Waka — Wayfinding in Complexity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
    <!--
      Hautū Waka, interactive diagram for reflexiv.co/artefact (October 2026).
      Diagram: Roimata Taniwha-Paoo and Ayla Hoeta, Auckland Co-design Lab, under the guidance of Matua Rereata Makiha.
      Reflection questions: Baruk Jacob (same wording as page two of the Hautū Waka poster).
      Phase spellings: Whakariterite, Te Rapunga, Te Kitenga, Te Whāinga, Te Whiwhinga, Te Rawenga.
    -->
    <style>
        :root {
            --bg-main: #FAFAFA;
            --bg-panel: #FFFFFF;
            --backdrop: rgba(0, 0, 0, 0.55);
            --text-primary: #333333;
            --text-secondary: #666666;
            --teal: #1a7a8c;
            --teal-dark: #145f6d;
            --teal-light: rgba(26, 122, 140, 0.1);
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
            --radius: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Raleway', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
        }

        /* Main container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
        }

        /* Diagram container */
        .diagram-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .diagram-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .diagram-credit {
            max-width: 1200px;
            margin: 8px auto 0;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Hotspots */
        .hotspot {
            position: absolute;
            border-radius: 50%;
            cursor: pointer;
            transition: box-shadow 0.2s ease, background 0.2s ease;
            background: transparent;
        }

        .hotspot:hover {
            box-shadow: 0 0 0 4px var(--teal-light), 0 0 20px rgba(26, 122, 140, 0.3);
            background: rgba(26, 122, 140, 0.05);
        }

        .hotspot:focus {
            outline: none;
            box-shadow: 0 0 0 4px var(--teal);
        }

        /* Hotspot positions */
        .hotspot-whakariterite {
            left: 8.7%;
            top: 20.0%;
            width: 14.3%;
            height: 20.2%;
        }

        .hotspot-rapunga {
            left: 7.7%;
            top: 51.0%;
            width: 14.3%;
            height: 20.2%;
        }

        .hotspot-kitenga {
            left: 28.2%;
            top: 46.3%;
            width: 11.6%;
            height: 16.4%;
        }

        .hotspot-kitenga-2 {
            left: 36.7%;
            top: 56.9%;
            width: 11.6%;
            height: 16.4%;
        }

        .hotspot-whainga {
            left: 40.5%;
            top: 28.0%;
            width: 14.0%;
            height: 19.8%;
        }

        .hotspot-whiwhinga {
            left: 50.1%;
            top: 47.2%;
            width: 14.3%;
            height: 20.2%;
        }

        .hotspot-rawenga {
            left: 75.9%;
            top: 35.4%;
            width: 14.3%;
            height: 20.2%;
        }

        /* Backdrop */
        .backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--backdrop);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 100;
        }

        .backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        /* Panel */
        .panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-panel);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            max-width: 680px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            z-index: 101;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .panel.active {
            opacity: 1;
            visibility: visible;
        }

        .panel-header {
            position: sticky;
            top: 0;
            background: var(--bg-panel);
            padding: 20px 24px 12px;
            border-bottom: 1px solid #eee;
            z-index: 1;
        }

        .panel-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .panel-close:hover {
            background: #f0f0f0;
        }

        .panel-close svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-secondary);
        }

        .panel-title {
            font-size: 26px;
            font-weight: 600;
            line-height: 1.2;
            color: var(--text-primary);
            padding-right: 40px;
        }

        .panel-subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .panel-content {
            padding: 20px 24px 24px;
        }

        .panel-section {
            margin-bottom: 24px;
        }

        .panel-section:last-child {
            margin-bottom: 0;
        }

        .panel-section-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            margin-bottom: 10px;
        }

        .panel-text {
            font-size: 16px;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .panel-text p {
            margin-bottom: 12px;
        }

        .panel-text p:last-child {
            margin-bottom: 0;
        }

        .reflection-questions {
            background: #f8f9fa;
            padding: 16px;
            border-radius: var(--radius);
            border-left: 3px solid var(--teal);
        }

        .reflection-questions li {
            margin-bottom: 8px;
            margin-left: 16px;
        }

        .reflection-questions li:last-child {
            margin-bottom: 0;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .panel {
                width: 95%;
                max-height: 90vh;
            }

            .panel-header {
                padding: 16px 16px 10px;
            }

            .panel-content {
                padding: 16px;
            }

            .panel-title {
                font-size: 22px;
            }

            .hotspot {
                min-width: 44px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>

<!-- Main content -->
<div class="container">
    <div class="diagram-container">
        <img src="hautu-waka-diagram.jpg" width="2400" height="1697" alt="Hautū Waka, wayfinding in complexity: six phases arranged as a voyage, from Whakariterite (prepare for the journey) and Te Rapunga (venture into the unknown), through a cycle of Te Kitenga (sight tohu), Te Whāinga (make decisions based on tohu) and Te Whiwhinga (do the do), to Te Rawenga (celebrate, reflect, acknowledge tohu). Based on work by Roimata Taniwha-Paoo and Ayla Hoeta, under the guidance of Matua Rereata Makiha.">

        <!-- Hotspots -->
        <div class="hotspot hotspot-whakariterite" tabindex="0" role="button"
             onclick="showStage('whakariterite')"
             onkeydown="handleKeydown(event, 'whakariterite')"
             aria-label="Whakariterite - Prepare for the journey"></div>

        <div class="hotspot hotspot-rapunga" tabindex="0" role="button"
             onclick="showStage('rapunga')"
             onkeydown="handleKeydown(event, 'rapunga')"
             aria-label="Te Rapunga - Venture into the unknown"></div>

        <div class="hotspot hotspot-kitenga" tabindex="0" role="button"
             onclick="showStage('kitenga')"
             onkeydown="handleKeydown(event, 'kitenga')"
             aria-label="Te Kitenga - Sight tohu"></div>

        <div class="hotspot hotspot-kitenga-2" tabindex="-1" aria-hidden="true"
             onclick="showStage('kitenga')"></div>

        <div class="hotspot hotspot-whainga" tabindex="0" role="button"
             onclick="showStage('whainga')"
             onkeydown="handleKeydown(event, 'whainga')"
             aria-label="Te Whāinga - Make decisions based on tohu"></div>

        <div class="hotspot hotspot-whiwhinga" tabindex="0" role="button"
             onclick="showStage('whiwhinga')"
             onkeydown="handleKeydown(event, 'whiwhinga')"
             aria-label="Te Whiwhinga - Do the do"></div>

        <div class="hotspot hotspot-rawenga" tabindex="0" role="button"
             onclick="showStage('rawenga')"
             onkeydown="handleKeydown(event, 'rawenga')"
             aria-label="Te Rawenga - Celebrate, reflect, acknowledge tohu"></div>
    </div>
    <p class="diagram-credit">Select any phase to explore it. Reflection questions by Baruk Jacob.</p>
</div>

<!-- Backdrop -->
<div class="backdrop" id="backdrop" onclick="closePanel()"></div>

<!-- Panel -->
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-header">
        <button class="panel-close" onclick="closePanel()" aria-label="Close panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
        </button>
        <h2 class="panel-title" id="panelTitle"></h2>
        <div class="panel-subtitle" id="panelSubtitle"></div>
    </div>
    <div class="panel-content" id="panelContent"></div>
</div>

<script>
// Data
const stages = {
    whakariterite: {
        id: 'whakariterite',
        name: 'Whakariterite',
        subtitle: 'Prepare for the journey',
        asStage: 'Define the journey\'s purpose. Determine who comes and who stays behind. Gather what you\'ll need — physically, mentally, spiritually. Set up Te Rawenga (the good place) by deciding what experience you want, not just where you\'re going.',
        asState: 'A mode of ongoing readiness. You return here when conditions demand reassessment — when the crew needs to change, when purpose has drifted, when you\'ve been at sea long enough to forget why you left.',
        questions: [
            'What is the purpose of this journey?',
            'What will the good place be like when we get there?',
            'Who needs to come on this journey, and who needs to stay off?',
            'What will we need on this journey, and what must we leave behind?'
        ]
    },
    rapunga: {
        id: 'rapunga',
        name: 'Te Rapunga',
        subtitle: 'Venture into the unknown',
        asStage: 'Set off into uncertainty. Name what you\'re afraid of and what excites you. Move from preparation into active searching with your whole being — not just your analytical mind.',
        asState: 'The experience of being in the unknown. You return here whenever you face unfamiliar territory, whenever the familiar signposts disappear, whenever you need to ask again: what are we afraid of? Sometimes the moana is wild; sometimes it\'s flat and you\'re not moving. Both are Te Rapunga.',
        questions: [
            'What are we excited about?',
            'What are we afraid of?',
            'What opportunities emerge out of that fear?'
        ]
    },
    kitenga: {
        id: 'kitenga',
        name: 'Te Kitenga',
        subtitle: 'Sight tohu',
        asStage: 'Look for signs. Identify where you\'re looking and what you\'re seeing. Triangulate — a single data point means nothing; you need convergent signals from multiple sources.',
        asState: 'A mode of heightened attention and pattern recognition. You can be here while also being in Te Rapunga. You\'re not acting yet — you\'re reading conditions, noticing what the environment, the organisation, or the situation is telling you. Stillness to see clearly.',
        questions: [
            'Where are we looking for tohu (signs)?',
            'What tohu are we seeing?',
            'What are we feeling, and what might that be telling us?'
        ]
    },
    whainga: {
        id: 'whainga',
        name: 'Te Whāinga',
        subtitle: 'Make decisions based on tohu',
        asStage: 'Assess the signs you\'ve gathered. Decide: push through, go around, or return? What risks can you afford? What can you not? Commit to a direction based on what you\'re seeing, not a predetermined plan.',
        asState: 'A decision point you can enter at any time. None of the choices are right or wrong — they\'re responses to conditions. You might cycle through multiple Te Whāinga moments in a single journey as new tohu emerge.',
        questions: [
            'What decisions do we need to take, based on the tohu?',
            'What risks can we afford to take? What can we not?'
        ]
    },
    whiwhinga: {
        id: 'whiwhinga',
        name: 'Te Whiwhinga',
        subtitle: 'Do the do',
        asStage: 'Execute. Grasp what you can take hold of. Assign who does what, by when, with what support. Move from analysis to committed action.',
        asState: 'The mode of committed engagement. Tūwhitia te hopo, mairangitia te angitū — feel the fear and do it anyway. You\'re grappling with the work, making mistakes, correcting as you go. Action in a dancing landscape, not execution of a fixed plan.',
        questions: [
            'Who needs to do what, by when?',
            'What help might they need?',
            'What new tohu is the doing showing us?'
        ]
    },
    rawenga: {
        id: 'rawenga',
        name: 'Te Rawenga',
        subtitle: 'Celebrate, reflect, acknowledge tohu',
        asStage: 'Arrive. Reflect on the journey. Celebrate what was achieved. Acknowledge the people and tohu who helped. Ask: what can we gift to others to help their future journeys?',
        asState: 'A mode of assessment and reflection. Is this the good place? You might arrive at your goal and realise it\'s not good enough. You might not reach your goal but find yourself somewhere that is. Te Rawenga isn\'t about hitting targets — it\'s about recognising when you\'ve arrived somewhere worth stopping.',
        questions: [
            'Have we reached the good place we described when we set out?',
            'How will we celebrate and reflect?',
            'Who, and which tohu, do we need to acknowledge?'
        ]
    }
};

// Functions
function showStage(stageId) {
    const stage = stages[stageId];
    if (!stage) return;

    renderStagePanel(stage);
    openPanel();
}

function renderStagePanel(stage) {
    document.getElementById('panelTitle').textContent = stage.name;
    document.getElementById('panelSubtitle').textContent = stage.subtitle;

    let html = '';

    // As a stage
    html += `
        <div class="panel-section">
            <div class="panel-section-title">As a stage</div>
            <div class="panel-text"><p>${stage.asStage}</p></div>
        </div>
    `;

    // As a state
    html += `
        <div class="panel-section">
            <div class="panel-section-title">As a state</div>
            <div class="panel-text"><p>${stage.asState}</p></div>
        </div>
    `;

    // Reflection questions
    html += `
        <div class="panel-section">
            <div class="panel-section-title">Reflection questions</div>
            <div class="reflection-questions">
                <ul>
                    ${stage.questions.map(q => `<li>${q}</li>`).join('')}
                </ul>
            </div>
        </div>
    `;

    // Tools: every tool can be used in every phase, so point to the tools section
    html += `
        <div class="panel-section">
            <div class="panel-section-title">Tools</div>
            <div class="panel-text"><p>Any of the nine tools can help here. Tools for Wayfinding, further down the page, shows how each one can be used in ${stage.name}.</p></div>
        </div>
    `;

    document.getElementById('panelContent').innerHTML = html;
}

function openPanel() {
    document.getElementById('backdrop').classList.add('active');
    document.getElementById('panel').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closePanel() {
    document.getElementById('backdrop').classList.remove('active');
    document.getElementById('panel').classList.remove('active');
    document.body.style.overflow = '';
}

function handleKeydown(event, stageId) {
    if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        showStage(stageId);
    }
}

// Close on escape
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closePanel();
    }
});
</script>

</body>
</html>
